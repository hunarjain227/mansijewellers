<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - Mansi Jewellers</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#3b231d,#6b4b3e);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.welcome-box{
    text-align:center;
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
    width:350px;
}

.logo{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:20px;
}

h1{
    color:#5a3525;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    background:#8B5A2B;
    color:#fff;
    padding:12px 30px;
    text-decoration:none;
    border-radius:30px;
    font-size:18px;
    transition:.3s;
}

.btn:hover{
    background:#6d4520;
}
</style>
</head>
<body>

<div class="welcome-box">

    <!-- Shop Logo -->
    <img src="mansi.jewellers_logo.png" alt="Mansi Jewellers Logo" class="logo">

    <h1>Welcome to</h1>
    <h2>Mansi Jewellers</h2>

    <p>Discover elegant Gold, Silver & Diamond Jewellery.</p>

    <!-- Go to Second Page -->
    <a href="index.html" class="btn">Start Shopping</a>

</div>

</body>
</html>
